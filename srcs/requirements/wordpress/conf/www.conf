[www]
# Usuario y grupo bajo el que se ejecutará el proceso (Alpine usa 'nobody' por defecto para servicios web)
user = nobody
group = nobody

# Escuchar en todas las interfaces de red en el puerto 9000
listen = 0.0.0.0:9000

# Asegurar que el proceso hijo de PHP-FPM herede las variables de entorno de tu .env
# Si no pones esto, WordPress no podrá leer tu $MYSQL_DATABASE ni las contraseñas
clear_env = no

# Gestión dinámica de procesos hijos (configuración estándar)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
