services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb_img
    restart: unless-stopped
    networks:
      - inception_net
    volumes:
      - db_data:/var/lib/mysql
    env_file: .env

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress_img
    restart: unless-stopped
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/html
    env_file: .env
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx_img
    restart: unless-stopped
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/html
    env_file: .env
    ports:
      - "443:443"
    depends_on:
      - wordpress

volumes:
  bd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jhonjairo03s/data/mariadb

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jhonjairo03s/data/wordpress

networks:
  inception_net:
    driver: bridge
